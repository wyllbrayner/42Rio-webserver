
  
server {
    listen 8003;
	server_name woliveir.42.fr www.woliveir.42.fr;
    host 127.0.0.1;
    index siege.html index.html;
    location /0 {
        allow_methods GET GET DELETE GET POST;
    }
    location /1 {
        methods POST GET;
    }
    location /2 {
        allow_methods  DELETE GET POST;
    }
}

server {
    listen 8002;
	server_name woliveir.42.fr localhost;
    host 127.0.0.1;
    index siege.html index.html;
    location /0 {
        allow_methods GET GET DELETE GET POST;
    }
    location /1 {
        methods POST GET;
    }
    location /2 {
        allow_methods  DELETE GET POST;
    }
}